<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Search | AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg"></div>
    <div class="container">
        <header>
            <h1>Visual Search</h1>
            <p>Find similar images instantly using deep learning.</p>
        </header>
        
        <main>
            <div id="drop-zone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <span>Drag & drop an image here</span>
                    <span class="sub-text">or click to browse</span>
                </div>
                <input type="file" id="file-input" accept="image/*" hidden>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <span>Analyzing visual features...</span>
            </div>

            <div id="results-container" class="results-container hidden">
                <h2>Top Matches</h2>
                <div id="results-grid" class="results-grid">
                    <!-- Results will be injected here by JS -->
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
